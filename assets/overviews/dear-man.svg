<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<text x="60" y="88" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#1a1a1a" text-anchor="start">DEAR MAN</text>
<text x="60" y="116" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#5f5f5f" text-anchor="start">DBT · interpersonal effectiveness · 10–15 min</text>
<line x1="60" y1="140" x2="1140" y2="140" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="60" y="184" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5f5f5f" text-anchor="start" letter-spacing="1.5">USE WHEN</text>
<line x1="60" y1="205" x2="68" y2="205" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78" y="210" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="start">You need to ask for something</text>
<line x1="60" y1="233" x2="68" y2="233" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78" y="238" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="start">You need to say no</text>
<line x1="60" y1="261" x2="68" y2="261" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78" y="266" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="start">A specific conversation is coming up</text>
<text x="60" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#a3261d" text-anchor="start" letter-spacing="1.5">NOT WHEN</text>
<line x1="60" y1="331" x2="68" y2="331" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78" y="336" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="start">The other person is unsafe for you</text>
<line x1="60" y1="359" x2="68" y2="359" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78" y="364" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="start">You do not actually want this</text>
<text x="78" y="385" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="start">conversation</text>
<line x1="60" y1="408" x2="68" y2="408" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="78" y="413" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="start">You are panicking — settle first</text>
<text x="60" y="457" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5f5f5f" text-anchor="start" letter-spacing="1.5">YOU LEAVE WITH</text>
<text x="60" y="483" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1a1a1a" text-anchor="start">A short script in your own words</text>
<text x="477" y="184" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5f5f5f" text-anchor="start" letter-spacing="1.5">STEPS</text>
<line x1="494" y1="220" x2="494" y2="639.5804195804196" stroke="#c9c9c9" stroke-width="1.2"/>
<circle cx="494" cy="220" r="17" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
<text x="494" y="225" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
<text x="532" y="217" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="start">The Ask</text>
<text x="532" y="237" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5f5f" text-anchor="start">One sentence: what you want, from whom, and what matters most</text>
<circle cx="494" cy="289.9300699300699" r="17" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
<text x="494" y="294.9300699300699" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
<text x="532" y="286.9300699300699" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="start">Describe</text>
<text x="532" y="306.9300699300699" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5f5f" text-anchor="start">Facts only. No “always”, no “never”.</text>
<circle cx="494" cy="359.86013986013984" r="17" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="494" y="364.86013986013984" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>
<text x="532" y="356.86013986013984" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="start">Express</text>
<text x="532" y="376.86013986013984" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5f5f" text-anchor="start">“I feel…”, not “you make me…”</text>
<circle cx="494" cy="429.79020979020976" r="17" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
<text x="494" y="434.79020979020976" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>
<text x="532" y="426.79020979020976" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="start">Assert</text>
<text x="532" y="446.79020979020976" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5f5f" text-anchor="start">Ask plainly, or say no plainly. No hints.</text>
<circle cx="494" cy="499.7202797202797" r="17" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="494" y="504.7202797202797" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5</text>
<text x="532" y="496.7202797202797" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="start">Reinforce</text>
<text x="532" y="516.7202797202797" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5f5f" text-anchor="start">What is in it for them, said honestly</text>
<circle cx="494" cy="569.6503496503497" r="17" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="494" y="574.6503496503497" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6</text>
<text x="532" y="566.6503496503497" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="start">Delivery Plan</text>
<text x="532" y="586.6503496503497" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5f5f" text-anchor="start">Stay Mindful, Appear confident, Negotiate</text>
<circle cx="494" cy="639.5804195804196" r="17" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="494" y="644.5804195804196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">7</text>
<text x="532" y="636.5804195804196" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="start">Read Back</text>
<text x="532" y="656.5804195804196" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#5f5f5f" text-anchor="start">The script assembled in your words</text>
<polygon points="494,677.3356643356644 501,684.3356643356644 494,691.3356643356644 487,684.3356643356644" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="501" y1="684.3356643356644" x2="524" y2="684.3356643356644" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="532" y="688.8356643356644" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#1a1a1a" text-anchor="start">Optional: rehearse it, with the assistant playing the other person</text>
<line x1="60" y1="720" x2="1140" y2="720" stroke="#c9c9c9" stroke-width="1"/>
<circle cx="68" cy="738" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
<text x="84" y="742" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5f5f5f" text-anchor="start">core step — the work happens here</text>
<polygon points="312,732 318,738 312,744 306,738" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="326" y="742" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5f5f5f" text-anchor="start">a branch or exit</text>
<text x="1140" y="742" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5f5f5f" text-anchor="end">A practice tool, not therapy. Safety comes before every step.</text>
</svg>
